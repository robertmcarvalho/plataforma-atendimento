# Pos-deploy obrigatorio apos nova revisao no Cloud Run: npm run gcp:post-deploy:pilot
# Ver docs/CLOUD_RUN_SCALING.md
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/dockerfiles/orchestrator.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/flux-farma-orchestrator:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/flux-farma-orchestrator:${_TAG}
substitutions:
  _TAG: latest
  _REGION: us-central1
  _REPO: panel-services
