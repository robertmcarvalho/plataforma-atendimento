steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/dockerfiles/webhook.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/flux-farma-webhook:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/flux-farma-webhook:${_TAG}
substitutions:
  _TAG: latest
  _REGION: us-central1
  _REPO: panel-services
